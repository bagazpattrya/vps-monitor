<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>VPS Monitor · Login</title>
<style>
:root{--bg:#0f1115;--card:#171b22;--mut:#8b93a3;--tx:#e8ecf1;--ac:#4da3ff;--bad:#f31260}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--tx);font:14px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
form{width:min(340px,92vw);background:var(--card);border:1px solid #232a35;border-radius:12px;padding:22px}
h1{font-size:18px;margin:0 0 4px}.mut{color:var(--mut);font-size:12px;margin:0 0 16px}
label{display:block;font-size:12px;color:var(--mut);margin:12px 0 4px}
input{width:100%;padding:9px 10px;border-radius:8px;border:1px solid #2c3544;background:#0f1115;color:var(--tx);font:inherit}
input:focus{outline:2px solid var(--ac);border-color:transparent}
button{width:100%;margin-top:18px;padding:10px;border:0;border-radius:8px;background:var(--ac);color:#04121f;font:inherit;font-weight:600;cursor:pointer}
button:disabled{opacity:.6;cursor:default}
#err{color:var(--bad);font-size:12px;min-height:18px;margin-top:12px}
</style>
</head>
<body>
<form id="f">
<h1>VPS Monitor</h1>
<p class="mut">Sign in with your server account</p>
<label for="u">Username</label>
<input id="u" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
<label for="p">Password</label>
<input id="p" name="password" type="password" autocomplete="current-password" required>
<button id="b" type="submit">Sign in</button>
<div id="err" role="alert"></div>
</form>
<script>
const f=document.getElementById('f'),err=document.getElementById('err'),b=document.getElementById('b');
f.addEventListener('submit',async e=>{
 e.preventDefault();err.textContent='';b.disabled=true;
 try{
  const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},
   body:JSON.stringify({username:f.username.value.trim(),password:f.password.value})});
  if(r.ok){location.href='/';return}
  const d=await r.json().catch(()=>({}));
  err.textContent=d.error||'Login failed';
 }catch{err.textContent='Network error'}
 b.disabled=false;f.password.value='';f.password.focus();
});
</script>
</body>
</html>
