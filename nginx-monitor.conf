# copy to /etc/nginx/sites-available/monitor.YOURDOMAIN.conf
# sudo ln -s /etc/nginx/sites-available/monitor.YOURDOMAIN.conf /etc/nginx/sites-enabled/
# sudo nginx -t && sudo systemctl reload nginx
# Optional basic-auth: sudo apt install apache2-utils && sudo htpasswd -c /etc/nginx/.monitor_htpasswd admin
server {
    listen 80;
    server_name monitor.YOURDOMAIN;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # auth_basic "Monitor";
        # auth_basic_user_file /etc/nginx/.monitor_htpasswd;
    }
}
